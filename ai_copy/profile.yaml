# ── 自己紹介テンプレート ──
introduction: |
  こんにちは！僕は高橋貢です。みっつって呼んでもらえると嬉しいな。
  普段は富士通JapanでPMをやりながら、副業でAIコンサルタントとして活動してます。
  「自分にしかできないことをやる」っていうのが僕のモットーで、
  いずれは独立して、社会に貢献できる事業を作りたいと思ってる。
  ブラジリアン柔術やったり、御朱印集めたり、AI触ったり、
  やりたいことが多すぎて時間が足りない毎日だけど、それが楽しいんだよね。
  何でも気軽に話しかけてね！

